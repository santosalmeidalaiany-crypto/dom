<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="app">
        <div class="topo"
         <h1>Minhas Tarefas</h1>
         <button id="tema" type="button">tema escuro</button>
       </div>
         
         <div class="entrada">
            <input id="tarefa" type="text" placeholder="Digite a tarefa" autocomplete="off">
            <button id="adicionar" type="button">Adicionar</button>
        </div>

        <p id="mensagem" class="mensagem"></p>

        <ul id="lista" class="lista"></ul>
        <p id="contador" class="contador">Nenhuma tarefa ainda.</p>
    </main>
</body>
</html>
